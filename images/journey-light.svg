<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="1020" height="520" role="img" aria-labelledby="t">
<title id="t">Amol Bhure, technical journey: 2012 Software engineering (Front-end libraries JavaScript and web apps); 2013 Penetration testing (Web, mobile and network consulting worldwide); 2015 Mobile &amp; IoT research (Android, iOS, firmware, BLE and Zigbee hacking); 2020 Product &amp; cloud security (Threat modelling, SAST/DAST, AWS and PCI encryption); 2021 Security at scale (Secure SDLC in 200+ repos, GRC, audits, teams 3 → 14); 2024 Security leadership (AppSec, Red Team, SOC, GRC with 18+ engineers); 2025 AI security architecture (LLM threat models, AI red teaming, agents and MCP). From breaking systems to securing AI.</title>
